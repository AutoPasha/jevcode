name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: run the checks that need no network
        run: python -m unittest discover -s tests -v

      # Named on its own so that a README quoting numbers it no longer has is a
      # red build and not a thing somebody notices months later.
      - name: the README must agree with bench/results.json
        run: python -m unittest tests/test_charts.py -v
